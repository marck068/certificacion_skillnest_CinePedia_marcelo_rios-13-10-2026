{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<section class="form-box">
    <h1>Registro</h1>
    <form method="post">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" value="{{ datos.get('nombre', '') }}" required>

        <label for="apellido">Apellido</label>
        <input id="apellido" name="apellido" value="{{ datos.get('apellido', '') }}" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ datos.get('email', '') }}" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" required>

        <button type="submit">Registrar</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
</section>
{% endblock %}
