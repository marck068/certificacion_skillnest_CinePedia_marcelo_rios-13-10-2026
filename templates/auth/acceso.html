{% extends "base.html" %}
{% block title %}Registro e Inicio de Sesión{% endblock %}
{% block content %}
<!-- Esta sección muestra Registro e Inicio de Sesión uno al lado del otro. -->
<div class="access-page">
    <section class="access-form">
        <h1>Registro</h1>

        <!-- Este formulario envía los datos a la ruta de registro que ya existe. -->
        <form action="{{ url_for('auth.registro') }}" method="post" class="fields-form">
            <label for="reg-nombre">Nombre</label>
            <input id="reg-nombre" name="nombre" minlength="3" required>

            <label for="reg-apellido">Apellido</label>
            <input id="reg-apellido" name="apellido" minlength="3" required>

            <label for="reg-email">E-mail</label>
            <input type="email" id="reg-email" name="email" required>

            <label for="reg-password">Contraseña</label>
            <input type="password" id="reg-password" name="password" minlength="8" required>

            <label for="reg-confirmar">Conf. Contraseña</label>
            <input type="password" id="reg-confirmar" name="confirmar" minlength="8" required>

            <div class="form-submit">
                <button type="submit">Registrar</button>
            </div>
        </form>

    </section>

    <section class="access-form">
        <h1>Inicio de Sesión</h1>

        <!-- Este formulario envía los datos a la ruta de inicio de sesión. -->
        <form action="{{ url_for('auth.login') }}" method="post" class="fields-form">
            <label for="login-email">E-mail</label>
            <input type="email" id="login-email" name="email" required>

            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" name="password" required>

            <div class="form-submit">
                <button type="submit">Iniciar Sesión</button>
            </div>
        </form>

    </section>
</div>
{% endblock %}
