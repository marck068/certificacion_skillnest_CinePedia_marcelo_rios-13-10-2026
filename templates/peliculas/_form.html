<!-- Formulario compartido para crear y editar películas. -->
<label for="nombre">Nombre de la Película</label>
<input id="nombre" name="nombre" value="{{ datos.get('nombre', '') }}" minlength="3" maxlength="150" required>

<label for="director">Director</label>
<input id="director" name="director" value="{{ datos.get('director', '') }}" minlength="3" maxlength="120" required>

<label for="fecha_estreno">Fecha Estreno</label>
<input id="fecha_estreno" type="date" name="fecha_estreno" value="{{ datos.get('fecha_estreno').isoformat() if datos.get('fecha_estreno') and datos.get('fecha_estreno').strftime is defined else datos.get('fecha_estreno', '') }}" required>

<label for="sinopsis">Sinopsis</label>
<textarea id="sinopsis" name="sinopsis" rows="5" minlength="3" maxlength="5000" required>{{ datos.get('sinopsis', '') }}</textarea>

<button type="submit">{{ boton }}</button>
<a class="button button-light" href="{{ url_for('peliculas.inicio') }}">Cancelar</a>
